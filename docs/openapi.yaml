          type: string
        department:
          type: array
          items:
            $ref: '#/components/schemas/Department'
        generation:
          type: integer
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        profile:
          type: string
          nullable: true
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
    MemberWorkReference:
      oneOf:
        - $ref: '#/components/schemas/EventMemberWorkReference'
        - $ref: '#/components/schemas/PersonalMemberWorkReference'
      discriminator:
        propertyName: workKind
        mapping:
          EVENT: '#/components/schemas/EventMemberWorkReference'
          PERSONAL: '#/components/schemas/PersonalMemberWorkReference'
    EventMemberWorkReference:
      type: object
      additionalProperties: false
      required: [workKind, eventWorkId, creditId, eventName, eventWorkTitle, title, type, releasedAt, sectionId, sectionName, sectionOrder, trackNumber]
      properties:
        workKind:
          type: string
          enum: [EVENT]
        eventWorkId:
          type: string
        creditId:
          $ref: '#/components/schemas/EventCredit/properties/id'
        eventName:
          type: string
        eventWorkTitle:
          type: string
        title:
          type: string
        type:
          $ref: '#/components/schemas/WorkType'
        releasedAt:
          type: string
        sectionId:
          $ref: '#/components/schemas/EventCredit/properties/sectionId'
        sectionName:
          $ref: '#/components/schemas/EventCredit/properties/sectionName'
        sectionOrder:
          $ref: '#/components/schemas/EventCredit/properties/sectionOrder'
        trackNumber:
          $ref: '#/components/schemas/EventCredit/properties/trackNumber'
    PersonalMemberWorkReference:
      type: object
      additionalProperties: false
      required: [workKind, personalWorkId, title, creatorIds, type, description, createdAt, links]
      properties:
        workKind:
          type: string
          enum: [PERSONAL]
        personalWorkId:
          type: string
        title:
          type: string
        creatorIds:
          type: array
          items:
            type: string
        type:
          $ref: '#/components/schemas/WorkType'
        description:
          type: string
        createdAt:
          type: string
          format: date
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
    Link:
      type: object
      required: [name, url]
      properties:
